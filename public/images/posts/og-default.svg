<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <!-- Glow -->
    <radialGradient id="glow-a" cx="20%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:rgba(249,115,22,0.18)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="80%" cy="60%" r="40%">
      <stop offset="0%" style="stop-color:rgba(59,130,246,0.12)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow-a)"/>
  <rect width="1200" height="630" fill="url(#glow-b)"/>

  <!-- Logo box -->
  <rect x="80" y="80" width="64" height="64" rx="14" fill="#1e293b"/>
  <text x="112" y="122" font-family="monospace" font-weight="800" font-size="22" fill="#f97316" text-anchor="middle">TS</text>

  <!-- Brand name -->
  <text x="160" y="107" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="white">TechSolve<tspan fill="#f97316">Lab</tspan></text>
  <text x="160" y="130" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.35)" letter-spacing="3">TECH &amp; AI INSIGHTS</text>

  <!-- Accent bar -->
  <rect x="80" y="200" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- Main headline -->
  <text x="80" y="290" font-family="Georgia, serif" font-size="58" fill="white" font-weight="400">Tools &amp; insights that</text>
  <text x="80" y="360" font-family="Georgia, serif" font-size="58" fill="white" font-weight="400">help US businesses</text>
  <text x="80" y="432" font-family="Georgia, serif" font-size="58" fill="url(#accent)" font-weight="400" font-style="italic">work smarter</text>

  <!-- Subline -->
  <text x="80" y="510" font-family="system-ui, sans-serif" font-size="22" fill="rgba(255,255,255,0.5)">techsolvelab.com</text>

  <!-- Decorative dots -->
  <circle cx="1100" cy="120" r="6" fill="rgba(249,115,22,0.4)"/>
  <circle cx="1130" cy="100" r="4" fill="rgba(249,115,22,0.25)"/>
  <circle cx="1080" cy="145" r="3" fill="rgba(249,115,22,0.2)"/>
  <circle cx="1050" cy="480" r="8" fill="rgba(59,130,246,0.2)"/>
  <circle cx="1100" cy="520" r="5" fill="rgba(59,130,246,0.15)"/>
  <circle cx="1140" cy="490" r="3" fill="rgba(59,130,246,0.1)"/>
</svg>
